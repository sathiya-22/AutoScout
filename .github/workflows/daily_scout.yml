name: AutoScout

on:
  schedule:
    # 09:00 IST = 03:30 UTC
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  run-scout:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Scout
        id: scout
        env:
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY:         ${{ secrets.TAVILY_API_KEY }}
          RESEND_API_KEY:         ${{ secrets.RESEND_API_KEY }}
          GITHUB_TOKEN:           ${{ secrets.GH_PAT }}
        run: python main.py

      - name: Commit updated data files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add seen_ideas.json idea_memory.json analytics.json || true
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "chore: update memory & analytics [skip ci]" && git push)

      # ── Health check: send failure email if any step above crashed ──────────
      - name: Notify on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python notify_failure.py \
            "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
